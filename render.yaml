# Triển khai một chạm trên Render: New → Blueprint → chọn repo này.
services:
  - type: web
    name: chua-tam-an
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js   # chạy node trực tiếp: tín hiệu tắt của Render tới thẳng node để ghi nốt dữ liệu (npm start làm mất tín hiệu này)
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SITE_NAME
        value: Chùa Tâm An
      - key: ADMIN_KEY
        generateValue: true
      - key: FUNDS
        value: Tùy nhà chùa sử dụng
      - key: DATABASE_URL       # chuỗi kết nối Neon (PostgreSQL), xem docs/NEON.md. Để trống: lưu file JSON, MẤT khi Render khởi động lại
        sync: false
      - key: DONATION_MODE
        value: test    # thử nghiệm: tự xác nhận 10 giây, không có giao dịch thật
      - key: BANK_ID
        value: "970436"   # Vietcombank (mã BIN theo VietQR)
      - key: BANK_ACCOUNT
        sync: false
      - key: BANK_ACCOUNT_NAME
        sync: false
      - key: BANK_LABEL
        value: Vietcombank
      - key: SEPAY_API_KEY
        sync: false
      - key: TTS_URL            # máy chủ đọc VieNeu (để trống: trình duyệt tự đọc)
        sync: false
      - key: TTS_VOICE
        value: Mai Anh
      - key: TTS_API_KEY
        sync: false
      - key: CF_TURN_KEY_ID     # TURN Cloudflare cho nói chuyện qua 4G
        sync: false
      - key: CF_TURN_API_TOKEN
        sync: false
