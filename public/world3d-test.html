<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thử nền 3D · Chùa Tâm An</title>
  <style>
    body { margin: 0; background: #292620; color: #ffebcf; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 1000px; margin: auto; padding: 16px; }
    h1 { font-size: 24px; }
    canvas { display: block; width: 100%; height: 60vh; min-height: 240px; }
    button, select { min-height: 44px; margin: 4px; padding: 8px 16px; font: inherit; }
    a { color: #ffdda1; }
  </style>
  <script type="importmap">
    { "imports": { "three": "/vendor/three/three.module.js?v=0.187.0" } }
  </script>
</head>
<body>
  <main>
    <h1>Thử nền 3D</h1>
    <p>Sàn, ánh sáng và khối thử. Trang này dành cho kiểm tra nền đồ họa.</p>
    <canvas id="world" aria-label="Cảnh thử 3D gồm sàn và một khối vuông"></canvas>
    <p id="status" role="status">Đang mở cảnh 3D…</p>
    <label>Mức đồ họa
      <select id="quality"><option value="low">Thấp</option><option value="medium" selected>Vừa</option><option value="high">Cao</option></select>
    </label>
    <button id="start" type="button">Mở lại</button>
    <button id="stop" type="button">Dừng</button>
    <p><a href="/">Về chùa</a></p>
  </main>
  <script type="module">
    import * as World3D from '/js/world3d/index.mjs?v=1';
    const status = document.getElementById('status');
    const quality = document.getElementById('quality');
    async function open() {
      try {
        const result = await World3D.start({
          canvas: document.getElementById('world'), scene: 'test', getState: () => ({}),
          quality: quality.value, on: { error: reason => { status.textContent = reason; } }
        });
        status.textContent = result.ok ? 'Cảnh 3D đã sẵn sàng.' : result.reason;
      } catch (error) { status.textContent = 'Chưa mở được cảnh thử 3D.'; }
    }
    document.getElementById('start').addEventListener('click', open);
    document.getElementById('stop').addEventListener('click', () => { World3D.stop(); status.textContent = 'Đã dừng và giải phóng cảnh 3D.'; });
    quality.addEventListener('change', () => { World3D.setQuality(quality.value); });
    globalThis.addEventListener('pagehide', () => World3D.stop());
    open();
  </script>
</body>
</html>
