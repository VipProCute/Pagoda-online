<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>MAY MẮN</title>
<link rel="stylesheet" href="card.css"></head>
<body><svg id="c" width="720" height="720" viewBox="0 0 720 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="lib.js"></script>
<script>
const R = rng(23);
add(E('rect', { width: 720, height: 720, fill: rg([[0, '#ff5fb0'], [0.45, '#c2208a'], [1, '#4d0a66']], { cx: 360, cy: 360, r: 520, u: true }) }));
// chùm sáng
let beams = '';
const bg = rg([[0, '#ffd9f0', 0.4], [1, '#ffd9f0', 0]], { cx: 360, cy: 380, r: 480, u: true });
for (let i = 0; i < 12; i++) {
  const a0 = (i * 30) * Math.PI / 180, a1 = a0 + 0.2, L = 560;
  beams += E('path', { d: `M360,380 L${360 + Math.cos(a0) * L},${380 + Math.sin(a0) * L} L${360 + Math.cos(a1) * L},${380 + Math.sin(a1) * L}Z`, fill: bg });
}
add(beams);
add(glow(360, 390, 330, '#ff9fd4', 0.5, 0.2));
// bokeh + kim tuyến
add(bokeh(R, 22, [0, 0, 720, 720], { colors: ['#ffd1ec', '#ffe9a8', '#fff'], rmin: 10, rmax: 40, omin: 0.1, omax: 0.3 }));
// tim bay
const hearts = [[120, 310, 52, -18], [610, 290, 62, 16], [70, 470, 36, 10], [660, 480, 44, -12], [220, 90, 34, 8], [520, 70, 40, -10], [330, 640, 38, 6], [470, 655, 28, -20], [180, 580, 30, 14], [590, 585, 34, -8], [655, 150, 30, 18], [60, 200, 28, -10]];
hearts.forEach(([x, y, s, rot], i) => add(heart(x, y, s, i % 3 === 0 ? '#ffd0e4' : '#ff9ec4', i % 3 === 0 ? '#ff4f9a' : '#e0245e', rot, 0.95)));
// khung vàng
add(E('rect', { x: 18, y: 18, width: 684, height: 684, rx: 34, fill: 'none', stroke: lg([[0, '#fff3b0'], [0.5, '#ffc23a'], [1, '#fff3b0']], { x1: 0, y1: 0, x2: 1, y2: 1 }), stroke_width: 7 }));
add(E('rect', { x: 32, y: 32, width: 656, height: 656, rx: 24, fill: 'none', stroke: '#fff', stroke_opacity: 0.7, stroke_width: 2, stroke_dasharray: '2 9', stroke_linecap: 'round' }));
// hoa hồng
add(roseBunch(R, 100, 105, 1.15, ROSES.red, { pal2: ROSES.hot, bud: [86, 60, 40] }));
add(roseBunch(R, 632, 628, 1.3, ROSES.red, { pal2: ROSES.hot, bud: [-100, -60, -35] }));
add(roseBunch(R, 650, 92, 0.62, ROSES.hot, { pal2: ROSES.pink, leaves: 5, spots: [[0, 0, 70], [-70, 20, 46], [20, 62, 42]] }));
add(roseBunch(R, 74, 650, 0.7, ROSES.hot, { pal2: ROSES.pink, leaves: 5, spots: [[0, 0, 70], [66, -22, 46], [-14, -60, 40]] }));
add(glitter(R, 90, [20, 20, 700, 700], { stars: 0.35, smin: 6, smax: 18, colors: ['#fff', '#ffe9a8', '#ffd1ea', '#fff'] }));
// chữ
add(fancy('Chúc bạn', { x: 360, y: 262, size: 62, font: 'Dancing Script', weight: 700, fill: '#fff', out1: '#d41a78', w1: 5, shadow: '#3a0050', sd: 4, sb: 3, so: 0.6, maxW: 400, rot: -4 }));
add(fancy('MAY MẮN', { x: 360, y: 424, size: 150, font: 'Be Vietnam Pro', weight: 800, ls: 3, fill: lg([[0, '#fffbd0'], [0.45, '#ffd84a'], [1, '#f19a12']]), out1: '#fff', w1: 3, out2: '#c4146f', w2: 4, shadow: '#32003f', sd: 9, sb: 6, so: 0.7, maxW: 600 }));   // viền mảnh hơn để dấu sắc và dấu á trong chữ Ắ không dính vào nhau
add(fancy('Một ngày thật nhiều niềm vui!', { x: 360, y: 502, size: 34, font: 'Be Vietnam Pro', weight: 800, fill: '#fff', out1: '#b0126a', w1: 4.5, shadow: '#32003f', sd: 4, sb: 3, so: 0.55, maxW: 560 }));
finish();
</script></body></html>
